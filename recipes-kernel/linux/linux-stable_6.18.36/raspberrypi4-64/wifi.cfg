# Embed the BCM43455 firmware into vmlinux: brcmfmac is built-in (=y), so it
# probes before the rootfs is up and must find its firmware in the kernel
# image, not /lib/firmware. Blobs staged into ${S}/firmware/brcm by the
# bbappend (pulled from mainline linux-firmware).
# Embed EVERY firmware brcmfmac/cfg80211 requests, so each resolves by direct
# load with zero "failed -2" warnings at boot:
#  - brcmfmac43455-sdio.raspberrypi,4-model-b.bin : the board-specific name
#    brcmfmac asks for FIRST (same binary as the base, staged under both names);
#  - brcmfmac43455-sdio.bin                       : base fallback;
#  - .clm_blob / NVRAM .txt                       : CLM + board calibration;
#  - regulatory.db (+ .p7s signature)             : cfg80211 regulatory DB.
CONFIG_EXTRA_FIRMWARE="brcm/brcmfmac43455-sdio.raspberrypi,4-model-b.bin brcm/brcmfmac43455-sdio.bin brcm/brcmfmac43455-sdio.clm_blob brcm/brcmfmac43455-sdio.raspberrypi,4-model-b.txt regulatory.db regulatory.db.p7s"
CONFIG_EXTRA_FIRMWARE_DIR="firmware"

# Belt-and-suspenders: fail any (future) missing-firmware direct load instantly
# instead of stalling ~60s on the legacy userspace/sysfs fallback helper. With
# everything above embedded there is no miss anyway, but the helper is useless
# on an image where firmware is embedded or on the rootfs.
# CONFIG_FW_LOADER_USER_HELPER is not set
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
