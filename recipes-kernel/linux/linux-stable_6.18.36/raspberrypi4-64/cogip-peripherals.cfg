# Cogip board peripherals, all built-in (monolithic kernel, 0 modules).

# SPI: spi1 is the AUX SPI carrying the MCP251xFD CAN-FD controller (copilot).
CONFIG_SPI=y
CONFIG_SPI_BCM2835=y
CONFIG_SPI_BCM2835AUX=y

# CAN stack + Microchip MCP251xFD driver (can0).
CONFIG_CAN=y
CONFIG_CAN_DEV=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_MCP251XFD=y

# I2C + PCF8523 RTC (correct clock at boot without NTP).
CONFIG_I2C=y
CONFIG_I2C_BCM2835=y
CONFIG_I2C_CHARDEV=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_PCF8523=y

# SC servos = USB CDC-ACM device (/dev/ttyACM0), opened by the planner.
# USB_ACM is =m upstream, so MODULES=n dropped it -> force it built-in.
CONFIG_USB=y
CONFIG_USB_ACM=y

# USB-A ports are behind the VL805 xHCI on the PCIe bus (RPi4). Without USB_PCI
# + USB_XHCI_PCI the xHCI driver can't bind it -> no USB-A, no /dev/ttyACM0 for
# the SC servos. The legacy defconfig had "# CONFIG_USB_PCI is not set".
CONFIG_PCI=y
CONFIG_USB_PCI=y
CONFIG_USB_XHCI_PCI=y

# GPU 3D acceleration: v3d is a SEPARATE driver from the vc4 display. Without
# it there is no /dev/dri/renderD128, Mesa falls back to llvmpipe (software),
# and WPE WebKit renders the dashboard on the CPU. V3D is =m upstream -> dropped
# by MODULES=n. (kconfig selects DRM_SCHED + DRM_GEM_SHMEM_HELPER.)
CONFIG_DRM_V3D=y
