# Kernel slimming for the Cogip kiosk (round 1: big, clearly-unused subsystems).
# Goal: faster kernel init + smaller Image. Everything cut here is either absent
# on the Pi4 hardware or unused by the kiosk. KEPT (do NOT cut): PCI/PCIE_BRCMSTB
# + USB_PCI/XHCI (VL805 USB-A), vc4 + v3d, mmc/usb/usb_acm, bcmgenet (eth),
# cfg80211/mac80211/brcmfmac + crypto (WPA/regdb/ssh), cgroups/namespaces
# (systemd), ext4/vfat, gpio/pwm/i2c/spi/can/rtc, input/HID (touchscreen).

# Virtualization / Xen: this is a Pi running bare-metal, not a hypervisor/guest.
# CONFIG_VIRTUALIZATION is not set
# CONFIG_XEN is not set

# NUMA: the Pi4 is single-node.
# CONFIG_NUMA is not set
# CONFIG_NUMA_BALANCING is not set

# Kexec / crash dump / hibernation: unused on a reflashed, swapless robot.
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set
# CONFIG_CRASH_DUMP is not set
# CONFIG_HIBERNATION is not set

# Audit + perf profiling: not used (systemd built without audit).
# CONFIG_AUDIT is not set
# CONFIG_PROFILING is not set

# Advanced networking the kiosk never uses (wifi + CAN + lo only): DSA switches,
# traffic-shaping qdiscs (TSN), VLANs. Default pfifo_fast stays (built-in).
# CONFIG_NET_DSA is not set
# CONFIG_NET_SCHED is not set
# CONFIG_VLAN_8021Q is not set

# PCI: keep the host controller (VL805 USB), drop endpoint mode + hotplug.
# CONFIG_PCI_ENDPOINT is not set
# CONFIG_HOTPLUG_PCI is not set

# Storage we do not have: no NOR/NAND flash (MTD), no NVMe, no SCSI/SAS / USB
# mass storage (servos are USB-ACM, not storage).
# CONFIG_MTD is not set
# CONFIG_BLK_DEV_NVME is not set
# CONFIG_SCSI is not set
# CONFIG_USB_STORAGE is not set

# TrustZone TEE: unused.
# CONFIG_TEE is not set
# CONFIG_OPTEE is not set

# HDMI-CEC: no CEC TV control (vc4 display itself stays).
# CONFIG_DRM_VC4_HDMI_CEC is not set
# CONFIG_MEDIA_CEC_SUPPORT is not set

# NOTE: do NOT disable SND / SND_SOC. DRM_VC4 `depends on SND && SND_SOC` (the
# vc4 HDMI has integrated audio), so cutting them silently drops DRM_VC4 -> no
# display. The kiosk has no audio use, but the sound stack must stay for the
# HDMI display driver to build. (Learned the hard way: trimming SND killed HDMI.)
