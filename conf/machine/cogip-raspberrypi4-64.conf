#@TYPE: Machine
#@NAME: COGIP RaspberryPi 4 Model B Development Board - 64 bits
#@DESCRIPTION: Machine configuration for the COGIP RaspberryPi 4 Model B board in 64 bits mode (https://www.raspberrypi.org/blog/raspberry-pi-zero-w-joins-family/)

MACHINE = "cogip-raspberrypi4-64"

require conf/machine/raspberrypi4-64.conf
require conf/machine/cogip-rpi-base.inc

COGIP_KERNEL_DEVICETREE = "bcm2711-rpi-4-b-cogip"

# Device tree used by Linux kernel (passed by the bootloader)
KERNEL_DEVICETREE = " \
    ${COGIP_KERNEL_DEVICETREE}.dtb \
"

# Device tree used by second stage bootloader only
RPI_DEVICE_TREE = "bootloader_devicetree/bcm2711-rpi-4-b.dtb"

COGIP_BOOT_FILES += " \
    ${COGIP_KERNEL_DEVICETREE}.dtb \
    rpi-bootfiles/bcm2711-rpi-4-b.dtb:${RPI_DEVICE_TREE} \
    rpi-bootfiles/fixup4.dat \
    rpi-bootfiles/start4.elf \
"
