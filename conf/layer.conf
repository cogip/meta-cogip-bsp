# meta-cogip-bsp layer configuration.
#
# Placeholder layer: the Cogip kiosk currently uses the stock
# raspberrypi4-64 machine from meta-raspberrypi. Custom machine /
# mainline kernel / device-tree overlays / on-target OpenOCD will be
# added here later (recovered from backup/legacy).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cogip-bsp"
BBFILE_PATTERN_cogip-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_cogip-bsp = "10"

LAYERSERIES_COMPAT_cogip-bsp = "scarthgap"

LAYERDEPENDS_cogip-bsp = " \
    core \
    raspberrypi \
"
